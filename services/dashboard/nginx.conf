# Project Atlas - dashboard web server
# AT-26-L1-002

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints its build output (app-4f2a9c.js), so a given filename
    # always has the same contents and can be cached indefinitely. index.html
    # is not fingerprinted and must never be cached, or a browser will keep
    # loading an old page that references assets which no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # The dashboard sends no credentials to third parties and loads nothing
    # from them. These headers say so to the browser rather than relying on it
    # to infer it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Compression matters here: the React bundle is the single largest thing
    # this server sends, and it is highly compressible text.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
