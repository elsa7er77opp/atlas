; Project Atlas - physical node firmware
; AT-26-L1-002  |  serves FR-03, FR-05, FR-06
;
; Library and toolchain versions are pinned rather than floating. The
; Consolidated Engineering Report names reproducible builds as the reason
; PlatformIO was selected over the Arduino IDE; a floating dependency would
; discard exactly that property.
;
; Sensor selection is a build flag, not a code edit. The bench is being
; populated as parts arrive, and the BME280 is on a long international lead
; time. Building with a sensor disabled compiles its driver out entirely, so a
; six-metric node and a nine-metric node are the same source at two build
; configurations - which is also what the simulator's ENABLE_BME280 switch does,
; keeping the two device classes on one payload contract.

[env:atlas-node]
platform  = espressif32@6.9.0
board     = esp32dev                 ; ESP32-WROOM-32, 38-pin DevKit variant
framework = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.0
    adafruit/Adafruit INA219@1.2.3
    adafruit/Adafruit MPU6050@2.2.6
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit AHTX0@2.0.5
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit Unified Sensor@1.1.14

; Deviation 9 in the deviation log. The BME280 remains on international lead
; time, so the environmental channel is served by an AHT20 + BMP280 breakout:
; two chips at two addresses covering the same three metrics one BME280 would
; have covered alone. The BME280 driver is deliberately NOT removed - when the
; part arrives the node returns to a single-chip configuration by flipping two
; flags, and the substitution stays visible in the build configuration rather
; than being buried in an edit history.
;
; ENABLE_BME280 and ENABLE_AHT20_BMP280 are mutually exclusive: both write
; temperature_c, and main.cpp raises a compile error if both are set.
;
; INA219 is now soldered, wired and on the bus, so it is enabled here. The
; MPU6050 stays at 0: it is physically absent, and leaving it enabled marks
; every sample degraded for a sensor that was never wired, which is a false
; fault report rather than a real one.
;
; Deviation 10 in the deviation log. The DevKit on the bench is a 38-pin
; variant, not the 30-pin part named in earlier revisions of the reports. Its
; width covers one full row of breadboard holes, so only one header row is
; reachable and GPIO21/GPIO22 sit on the buried side. The I2C bus therefore
; moves to GPIO25 and GPIO26 in include/atlas_config.h - both are general
; purpose pins with no boot-strapping role, so behaviour is unchanged.

build_flags =
    -D ENABLE_INA219=1               ; soldered, wired, on the bus
    -D ENABLE_MPU6050=0              ; physically absent - keep at 0
    -D ENABLE_BME280=0               ; sensor on order - set to 1 on arrival
    -D ENABLE_AHT20_BMP280=1         ; the breakout actually on the bench
    -D MQTT_MAX_PACKET_SIZE=512      ; see the note in main.cpp
    -Wall
