# Project Atlas - platform stack
# AT-26-L1-002  |  NFR-01, NFR-02

services:

  broker:
    image: eclipse-mosquitto:2
    container_name: atlas-broker
    restart: unless-stopped
    ports:
      - "8883:8883"      # TLS - the only port devices use
      - "9001:9001"      # websockets
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_dynsec:/mosquitto/dynsec
    networks: [atlas]

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # NOT published to the host - reachable only on the atlas network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [atlas]

  simulator:
    build: ./simulator
    container_name: atlas-simulator
    restart: unless-stopped
    depends_on: [broker]
    environment:
      MQTT_HOST: atlas-broker
      MQTT_PORT: "8883"
      MQTT_CA: /certs/ca.crt
      MQTT_USERNAME: ${MQTT_SIM01_USER}
      MQTT_PASSWORD: ${MQTT_SIM01_PASSWORD}
      DEVICE_UID: atlas-sim-01
      SITE: lab-a
      SAMPLE_INTERVAL_MS: "1000"
      ENABLE_BME280: "true"
    volumes:
      - ./infra/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    networks: [atlas]

  ingest:
    build: ./services/ingest
    container_name: atlas-ingest
    restart: unless-stopped
    depends_on:
      broker: {condition: service_started}
      db:     {condition: service_healthy}
    environment:
      MQTT_HOST: atlas-broker
      MQTT_PORT: "8883"
      MQTT_CA: /certs/ca.crt
      MQTT_USERNAME: ${MQTT_INGEST_USER}
      MQTT_PASSWORD: ${MQTT_INGEST_PASSWORD}
      POSTGRES_HOST: atlas-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QUEUE_MAX: "600"
      BATCH_SIZE: "50"
      BATCH_MS: "500"
    volumes:
      - ./infra/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    networks: [atlas]

  anomaly:
    build: ./services/anomaly
    container_name: atlas-anomaly
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      POSTGRES_HOST: atlas-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      Z_WINDOW: "300"
      Z_SIGMA: "3.0"
      CONFIRM_SAMPLES: "3"
      CLEAR_SAMPLES: "3"
      POLL_MS: "1000"
    networks: [atlas]


  api:
    build: ./services/api
    container_name: atlas-api
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./infra/mosquitto/certs/ca.crt:/certs/ca.crt:ro
    environment:
      POSTGRES_HOST: atlas-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      BROKER_PROVISIONING: ${BROKER_PROVISIONING:-static}
      BROKER_HOST: atlas-broker
      BROKER_PORT: "8883"
      BROKER_CA: /certs/ca.crt
      DYNSEC_ADMIN_USER: ${DYNSEC_ADMIN_USER:-}
      DYNSEC_ADMIN_PASSWORD: ${DYNSEC_ADMIN_PASSWORD:-}
      MQTT_API_USER: ${MQTT_API_USER:-atlas_api}
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:-}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_DEV_LOG_CODE: ${EMAIL_DEV_LOG_CODE:-false}
      OTP_TTL_MIN: ${OTP_TTL_MIN:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      ACCESS_TTL_MIN: "15"
      REFRESH_TTL_DAYS: "7"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [atlas]


  dashboard:
    build:
      context: ./services/dashboard
      args:
        VITE_API_BASE: "http://localhost:8000"
    container_name: atlas-dashboard
    restart: unless-stopped
    depends_on: [api]
    ports:
      # Published on 5173 deliberately: the API's CORS_ORIGINS already names
      # that origin, so the served build and the development server are the
      # same origin and no CORS change is needed between them.
      - "127.0.0.1:5173:8080"
    networks: [atlas]

volumes:
  mosquitto_data:
  mosquitto_dynsec:
  pgdata:

networks:
  atlas:
    driver: bridge
