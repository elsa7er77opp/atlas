# Project Atlas - Mosquitto broker
# AT-26-L1-002  |  serves FR-03, FR-05, FR-26

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# No anonymous access. Every client authenticates.  FR-26
allow_anonymous false
# Dynamic Security Plugin. Replaces the static password and ACL files.
# The client and role store is mutable state on a writable Docker volume.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/dynsec/dynamic-security.json

# Plain MQTT - bound to the container network only, never published to the host
listener 1883
protocol mqtt

# TLS listener - this is the one exposed to devices.  FR-26
listener 8883
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

# WebSocket over TLS, for browser-side diagnostics if needed later
listener 9001
protocol websockets
